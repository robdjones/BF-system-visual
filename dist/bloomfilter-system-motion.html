<title>Bloomfilter System Motion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Bloomfilter system motion prototype — shared kit
   Reel-faithful flat language: cream field, solid shapes, black stadium pills, white grotesque, colored beads.
   Single committed look (cream) by design: the scenes are the artwork, so no dark-theme variant. */
:root {
  --cream: #FCF3E1;
  --ink: #111111;
  --white: #FFFFFF;
  --orchid: #F090F0;      /* container signal color (reel) — swap here if a Bloomfilter color is chosen */
  --dot-orange: #F26B21;
  --dot-yellow: #F5C400;
  --dot-purple: #6A4CFF;
  --dot-olive: #7A8A2E;
  --rule: rgba(17,17,17,0.14);
  --font: "Inter", "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--cream); color: var(--ink); font-family: var(--font); }
body { display: flex; flex-direction: column; min-height: 100%; }
.stage-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; min-height: 0; }
svg.stage { width: 100%; height: 100%; max-height: calc(100vh - 88px); max-width: 100%; display: block; }
svg.stage text { font-family: var(--font); font-weight: 500; fill: var(--white); pointer-events: none; user-select: none; }

/* viewer chrome (not part of the scene) */
.bar {
  display: flex; align-items: center; gap: 14px; padding: 12px 16px; flex-wrap: wrap;
  border-top: 1px solid var(--rule); font-size: 13px; letter-spacing: 0.01em;
}
.bar .title { font-weight: 600; white-space: nowrap; }
.bar .title span { font-weight: 400; opacity: 0.55; margin-left: 8px; }
.bar button, .chapters button {
  font: inherit; font-size: 13px; font-weight: 600; background: var(--ink); color: var(--white); border: 0; border-radius: 999px;
  padding: 6px 14px; cursor: pointer; min-width: 64px;
}
.bar button.ghost, .chapters button { background: transparent; color: var(--ink); border: 1px solid rgba(17,17,17,0.25); }
.bar button:focus-visible, .chapters button:focus-visible, .bar input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.bar input[type=range] { flex: 1; accent-color: var(--ink); min-width: 120px; }
.bar .time { font-variant-numeric: tabular-nums; min-width: 96px; text-align: right; opacity: 0.7; }
.bar .phases { display: flex; gap: 6px; }
.bar .phase { padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(17,17,17,0.2); opacity: 0.45; transition: opacity .15s, background .15s, color .15s; }
.bar .phase.on { opacity: 1; background: var(--ink); color: var(--white); border-color: var(--ink); }

/* chapter switch (index / combined viewer) */
.chapters { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--rule); font-size: 13px; flex-wrap: wrap; }
.chapters .name { font-weight: 600; margin-right: 6px; }
.chapters .name span { font-weight: 400; opacity: .55; margin-left: 8px; }
.chapters button.on { background: var(--ink); color: var(--white); border-color: var(--ink); }
.chapters .hint { margin-left: auto; opacity: .55; }
@media (max-width: 720px) { .bar .phases, .bar .title span, .chapters .hint, .chapters .name span { display: none; } }
@media (prefers-reduced-motion: reduce) { .bar .phase { transition: none; } }

html, body { height: 100%; }
body { padding-inline: 0; }
.chapters { padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
.bar { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
</style>

<nav class="chapters" aria-label="Chapters">
  <span class="name">Bloomfilter · System motion<span>two isolated stages</span></span>
  <button type="button" data-scene="pile" id="ch-pile">1 · Pile</button>
  <button type="button" data-scene="transform" id="ch-transform">2 · Transform</button>
  <span class="hint">1 / 2 switch · space play · ← → step · R replay</span>
</nav>
<div class="stage-wrap"><svg class="stage" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Motion scene"></svg></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script>
/* Bloomfilter system motion prototype — shared runtime
   Deterministic: every frame is a pure function of time t, so scenes are scrubbable and loop exactly. */
(function (global) {
  const KIT = {
    cream: '#FCF3E1', ink: '#111111', white: '#FFFFFF', orchid: '#F090F0',
    dots: ['#F26B21', '#F5C400', '#6A4CFF', '#7A8A2E'],
    pillH: 42, font: 19, padX: 20, dotR: 10,
  };

  // ---------- math ----------
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const lerp = (a, b, t) => a + (b - a) * t;
  const remap = (t, a, b) => clamp01((t - a) / (b - a));
  const ease = {
    linear: (t) => t,
    in: (t) => t * t * t,
    out: (t) => 1 - Math.pow(1 - t, 3),
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outLong: (t) => 1 - Math.pow(1 - t, 5),
    smooth: (t) => t * t * (3 - 2 * t),
    // quick pop: overshoot-free settle (scale 1.06 -> 1)
    settle: (t) => 1 + 0.06 * (1 - t) * Math.sin(t * Math.PI),
  };
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rng = (seed) => {
    const r = mulberry32(seed);
    return { f: r, range: (a, b) => a + (b - a) * r(), pick: (arr) => arr[Math.floor(r() * arr.length)], sign: () => (r() < 0.5 ? -1 : 1) };
  };
  // periodic "independent drift": sum of sines whose periods divide loopLen -> seamless
  function makeDrift(r, loopLen, amp, ks) {
    const comps = ks.map((k) => ({ k, ph: r.range(0, Math.PI * 2), a: amp * r.range(0.5, 1) / Math.sqrt(k) }));
    return (t) => comps.reduce((s, c) => s + c.a * Math.sin((2 * Math.PI * c.k * t) / loopLen + c.ph), 0);
  }
  // a short one-off pulse of width w starting at t0, returns 0..1..0
  const pulse = (t, t0, w) => { const u = (t - t0) / w; return u <= 0 || u >= 1 ? 0 : Math.sin(u * Math.PI); };

  // ---------- svg ----------
  const NS = 'http://www.w3.org/2000/svg';
  const el = (name, attrs = {}, parent) => {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };

  // Token: pill (label), frag (blank pill, "unfinished"), dot (bead). size = { h, font, padX } overrides.
  function makeToken(parent, spec, size = {}) {
    const H = size.h || KIT.pillH, FONT = size.font || KIT.font, PAD = size.padX || KIT.padX;
    const g = el('g', { class: 'tok ' + spec.kind }, parent);
    const tok = { spec, g, w: 0, h: H };
    if (spec.kind === 'dot') {
      tok.r = spec.r || KIT.dotR;
      tok.circle = el('circle', { r: tok.r, fill: spec.color || KIT.dots[0] }, g);
      tok.w = tok.r * 2; tok.h = tok.r * 2;
    } else {
      tok.rect = el('rect', { height: H, rx: H / 2, ry: H / 2, fill: KIT.ink }, g);
      tok.text = el('text', { 'font-size': FONT, 'text-anchor': 'middle', 'dominant-baseline': 'central', y: 0, opacity: spec.kind === 'pill' ? 1 : 0 }, g);
      tok.text.textContent = spec.label || '';
      tok.w = spec.kind === 'pill' ? tok.text.getComputedTextLength() + PAD * 2 : (spec.w || 70);
      tok.setWidth = (w) => { tok.rect.setAttribute('width', w); tok.rect.setAttribute('x', -w / 2); tok.rect.setAttribute('y', -H / 2); };
      tok.setWidth(tok.w);
    }
    tok.set = (s) => {
      const sc = s.scale == null ? 1 : s.scale;
      g.setAttribute('transform', `translate(${s.x.toFixed(2)} ${s.y.toFixed(2)}) rotate(${(s.rot || 0).toFixed(2)}) scale(${sc.toFixed(4)})`);
      g.setAttribute('opacity', s.opacity == null ? 1 : s.opacity);
      if (s.w != null && tok.setWidth) tok.setWidth(s.w);
      if (s.r != null && tok.circle) tok.circle.setAttribute('r', s.r);
      if (s.labelOpacity != null && tok.text) tok.text.setAttribute('opacity', s.labelOpacity);
      if (s.visible === false) g.setAttribute('display', 'none'); else g.removeAttribute('display');
    };
    return tok;
  }

  // ---------- timeline + viewer chrome ----------
  class Timeline {
    constructor({ duration, render, loopStart = 0, phases = [], title = '', subtitle = '', mount = document.body }) {
      Object.assign(this, { duration, render, loopStart, phases, t: 0, playing: false, loop: true, alive: true });
      this._last = null;
      this.buildBar(title, subtitle, mount);
      this.seek(0);
      this._tick = this._tick.bind(this);
      requestAnimationFrame(this._tick);
    }
    destroy() { this.alive = false; this.playing = false; window.removeEventListener('keydown', this._keys); this.bar.remove(); }
    buildBar(title, subtitle, mount) {
      const bar = document.createElement('div'); bar.className = 'bar'; this.bar = bar;
      bar.innerHTML = `
        <div class="title">${title}<span>${subtitle}</span></div>
        <button class="play">Pause</button>
        <button class="ghost replay">Replay</button>
        <input type="range" min="0" max="${this.duration}" step="0.01" value="0">
        <div class="time"></div>
        <div class="phases">${this.phases.map((p) => `<div class="phase">${p.name}</div>`).join('')}</div>`;
      mount.appendChild(bar);
      this.ui = {
        play: bar.querySelector('.play'), range: bar.querySelector('input'), time: bar.querySelector('.time'),
        phases: [...bar.querySelectorAll('.phase')],
      };
      this.ui.play.onclick = () => (this.playing ? this.pause() : this.play());
      bar.querySelector('.replay').onclick = () => { this.seek(0); this.play(); };
      this.ui.range.oninput = (e) => { this.pause(); this.seek(parseFloat(e.target.value)); };
      this._keys = (e) => {
        if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.code !== 'Space') return;
        if (e.code === 'Space') { e.preventDefault(); this.playing ? this.pause() : this.play(); }
        if (e.code === 'ArrowRight') { e.preventDefault(); this.pause(); this.seek(Math.min(this.duration, this.t + (e.shiftKey ? 1 : 1 / 30))); }
        if (e.code === 'ArrowLeft') { e.preventDefault(); this.pause(); this.seek(Math.max(0, this.t - (e.shiftKey ? 1 : 1 / 30))); }
        if (e.key === 'r') { this.seek(0); this.play(); }
      };
      window.addEventListener('keydown', this._keys);
    }
    play() { this.playing = true; this._last = null; this.ui.play.textContent = 'Pause'; }
    pause() { this.playing = false; this.ui.play.textContent = 'Play'; }
    seek(t) {
      this.t = t; this.render(t);
      this.ui.range.value = t; this.ui.time.textContent = `${t.toFixed(2)} / ${this.duration.toFixed(2)}s`;
      this.ui.phases.forEach((p, i) => p.classList.toggle('on', t >= this.phases[i].from && t < this.phases[i].to));
    }
    _tick(now) {
      if (!this.alive) return;
      if (this.playing) {
        if (this._last != null) {
          let t = this.t + (now - this._last) / 1000;
          if (t >= this.duration) t = this.loop ? this.loopStart + (t - this.duration) : this.duration;
          this.seek(t);
          if (!this.loop && t >= this.duration) this.pause();
        }
        this._last = now;
      }
      requestAnimationFrame(this._tick);
    }
  }

  global.BF = { KIT, clamp01, lerp, remap, ease, rng, makeDrift, pulse, el, makeToken, Timeline, scenes: {} };
})(window);

/* STAGE 1 — Unorganized systems pile (gravity)
   Concept: work systems, tools and measures sit as a disconnected mess.
   Motion job: big tokens drop in at irregular moments, tumble, and settle on each other in a loose heap
   along the bottom of the screen. No shared rhythm, nothing processed — just gravity.
   Implementation: a 2D rigid-body sim (Matter.js) is pre-run once at load with a fixed timestep, so every
   frame is a lookup → the scene stays deterministic, scrubbable and loops exactly. */
BF.scenes.pile = (svg, mount) => {
  const { KIT, lerp, remap, ease, rng, el, makeToken, Timeline } = BF;
  const M = window.Matter;
  el('rect', { width: 1200, height: 800, fill: KIT.cream }, svg);
  if (!M) {
    const msg = el('text', { x: 600, y: 400, 'text-anchor': 'middle', 'font-size': 22, fill: KIT.ink }, svg);
    msg.textContent = 'Physics library (matter-js) did not load — check network / CDN access.';
    const tl = new Timeline({ duration: 1, render: () => {}, title: 'Stage 1', subtitle: 'unorganized systems pile', mount });
    return tl;
  }
  const layer = el('g', {}, svg);
  const veil = el('rect', { width: 1200, height: 800, fill: KIT.cream, opacity: 0, 'pointer-events': 'none' }, svg);

  const DUR = 12, FPS = 60, LAST_DROP = 7.4;
  const SIZE = { h: 70, font: 30, padX: 30 };
  const r = rng(1039);

  // token specs — approximate, diagrammatic labels (not product logos)
  const labels = ['Jira', 'GitHub', 'Agents', 'Copilot', 'Cursor', 'PRs', 'Tickets', 'Sessions', 'Tokens', 'Cycle time', 'Rework', 'Handoffs', 'Deploys', 'Models', 'Traces', 'Sprints', 'Reviews', 'Incidents', 'Specs', 'Runs'];
  const specs = [];
  labels.forEach((label) => specs.push({ kind: 'pill', label }));
  for (let i = 0; i < 5; i++) specs.push({ kind: 'frag', w: r.range(64, 180) });
  for (let i = 0; i < 14; i++) specs.push({ kind: 'dot', color: r.pick(KIT.dots), r: r.range(15, 27) });
  const tokens = specs.map((spec) => makeToken(layer, spec, SIZE));

  // drop schedule: irregular gaps (clumps and pauses), never a beat
  const order = tokens.slice().sort(() => r.f() - 0.5);
  let t = 0.3;
  order.forEach((tok) => { tok.spawn = t; t += r.f() < 0.3 ? r.range(0.03, 0.1) : r.range(0.14, 0.42); });
  const squeeze = (LAST_DROP - 0.3) / (t - 0.3);
  order.forEach((tok) => (tok.spawn = 0.3 + (tok.spawn - 0.3) * squeeze));

  // ---- physics world (pre-simulated)
  const engine = M.Engine.create({ enableSleeping: true });
  engine.gravity.y = 1.35;
  const world = engine.world;
  M.Composite.add(world, [
    M.Bodies.rectangle(600, 860, 1600, 120, { isStatic: true, friction: 1 }),      // floor = bottom of the screen
    M.Bodies.rectangle(-60, 0, 120, 3000, { isStatic: true }),                     // invisible side walls
    M.Bodies.rectangle(1260, 0, 120, 3000, { isStatic: true }),
  ]);
  const bodyOpts = () => ({ friction: 0.55, frictionStatic: 0.9, restitution: 0.03, density: 0.002 });
  order.forEach((tok) => {
    // aim at the middle of the screen with a bell-ish spread so a heap forms, plus a few wide strays
    const g = (r.f() + r.f() + r.f()) / 3;
    let x = 600 + (g - 0.5) * 760;
    if (r.f() < 0.12) x = 600 + r.sign() * r.range(380, 520);
    const y = -140 - r.range(0, 120);
    const w = tok.w, h = tok.h;
    tok.body = tok.spec.kind === 'dot'
      ? M.Bodies.circle(x, y, tok.r, bodyOpts())
      : M.Bodies.rectangle(x, y, w, h, { chamfer: { radius: h / 2 - 1 }, ...bodyOpts() });
    tok.angle0 = tok.spec.kind === 'dot' ? 0 : r.range(-1.2, 1.2);
    tok.spin0 = r.range(-0.09, 0.09);
    tok.vx0 = r.range(-1.6, 1.6);
  });

  const STEPS = Math.ceil(DUR * FPS) + 1;
  const frames = new Array(STEPS);
  let next = 0;
  for (let s = 0; s < STEPS; s++) {
    const st = s / FPS;
    while (next < order.length && order[next].spawn <= st) {
      const tok = order[next++];
      M.Body.setAngle(tok.body, tok.angle0);
      M.Body.setAngularVelocity(tok.body, tok.spin0);
      M.Body.setVelocity(tok.body, { x: tok.vx0, y: 3 });
      M.Composite.add(world, tok.body);
      tok.added = true;
    }
    frames[s] = tokens.map((tok) => (tok.added ? [tok.body.position.x, tok.body.position.y, tok.body.angle] : null));
    M.Engine.update(engine, 1000 / FPS);
  }

  function render(t) {
    const f = Math.min(STEPS - 1, Math.max(0, t * FPS));
    const i0 = Math.floor(f), i1 = Math.min(STEPS - 1, i0 + 1), u = f - i0;
    tokens.forEach((tok, k) => {
      const a = frames[i0][k], b = frames[i1][k] || a;
      if (!a) { tok.set({ x: 0, y: 0, visible: false }); return; }
      let rot = (lerp(a[2], b[2], u) * 180) / Math.PI;
      // a stadium is symmetric under a half turn: keep labels upright without changing the silhouette
      if (tok.spec.kind === 'pill') rot = (((rot + 90) % 180) + 180) % 180 - 90;
      tok.set({ x: lerp(a[0], b[0], u), y: lerp(a[1], b[1], u), rot });
    });
    veil.setAttribute('opacity', Math.max(remap(t, DUR - 0.4, DUR), 1 - remap(t, 0, 0.3)));
  }

  const tl = new Timeline({ duration: DUR, render, title: 'Stage 1', subtitle: 'unorganized systems pile', phases: [], mount });
  tl.play();
  return tl;
};

/* STAGE 2 — Transformation
   Concept: Bloomfilter takes the mess and works on it in place — capture, resolve, sequence, normalize.
   Show: one solid rectangle holding five mixed rows. Row by row (staggered so several operations are
   visible at once) elements APPEAR (captured), duplicates slide together and DISAPPEAR (resolved), rows
   REORDER (sequenced), and shapes CHANGE (normalized: fragments become labelled pills, beads and pills
   converge to one size, tilt and uneven gaps go away). Ends on one shared rhythm, dips to cream, loops. */
BF.scenes.transform = (svg, mount) => {
  const { KIT, lerp, remap, ease, rng, pulse, el, makeToken, Timeline } = BF;
  el('rect', { width: 1200, height: 800, fill: KIT.cream }, svg);
  const RECT = { x: 130, y: 100, w: 940, h: 600 };
  el('rect', { x: RECT.x, y: RECT.y, width: RECT.w, height: RECT.h, fill: KIT.orchid }, svg);
  const layer = el('g', {}, svg);
  const veil = el('rect', { width: 1200, height: 800, fill: KIT.cream, opacity: 0, 'pointer-events': 'none' }, svg);

  const SIZE = { h: 54, font: 24, padX: 24 };
  const W_U = 160, R_U = 12, GAP_U = 20, LEFT = RECT.x + 48; // max per row after normalize: 4 pills + 3 beads
  const ROW_Y = [170, 285, 400, 515, 630];
  const r = rng(7700);

  // ---- row content (initial, mixed). 'dup' = duplicate record, 'new' = not yet captured, frag = unfinished
  const D = (c, big) => ({ kind: 'dot', color: KIT.dots[c], r: big ? r.range(19, 24) : r.range(9, 15) });
  const P = (label, o = {}) => ({ kind: 'pill', label, ...o });
  const F = (label) => ({ kind: 'frag', w: r.range(50, 120), label });
  const rows = [
    [P('Jira'), D(0), P('GitHub'), F('Deploys'), P('Jira', { dup: true }), D(2, true), P('Models', { fresh: true })],
    [D(1), P('Cycle time'), P('Sessions'), F('Traces'), D(3, true), P('Tokens', { fresh: true }), P('Sessions', { dup: true })],
    [P('Agents'), P('Agents', { dup: true }), D(2), F('Specs'), P('Rework'), D(1, true), P('PRs', { fresh: true })],
    [F('Runs'), P('PRs'), D(3), P('Cursor'), D(0, true), P('Tickets'), P('Cursor', { dup: true }), { ...D(2), fresh: true }],
    [P('Copilot'), D(1), F('Reviews'), P('Handoffs'), D(3, true), D(0), P('Handoffs', { dup: true }), P('Sprints', { fresh: true })],
  ];

  // ---- build tokens + initial attrs
  const items = [];
  rows.forEach((specs, ri) => {
    specs.forEach((spec, ci) => {
      const tok = makeToken(layer, spec, SIZE);
      const dot = spec.kind === 'dot';
      Object.assign(tok, {
        row: ri, present: !spec.fresh, fresh: !!spec.fresh, dup: !!spec.dup,
        attrs: {
          w: tok.w, r: dot ? tok.r : 0, rot: dot ? 0 : r.range(-12, 12), dy: r.range(-9, 9),
          gap: GAP_U + r.range(-12, 28), scale: spec.fresh ? 0 : (dot ? 1 : r.range(0.86, 1.14)), opacity: 1, labelOp: spec.kind === 'pill' ? 1 : 0,
        },
        kf: [],
      });
      items.push(tok);
    });
  });
  const rowItems = (ri) => items.filter((t) => t.row === ri && t.present);

  // ---- layout helpers: positions from the row's ordered list
  const layout = (ri, list, uniform) => {
    let x = LEFT; const out = new Map();
    list.forEach((tok) => {
      const w = uniform ? (tok.spec.kind === 'dot' ? R_U * 2 : W_U) : tok.attrs.w;
      out.set(tok, x + w / 2);
      x += w + (uniform ? GAP_U : tok.attrs.gap);
    });
    return out;
  };
  const snapshot = (tok, x) => ({ x, y: ROW_Y[tok.row] + tok.attrs.dy, rot: tok.attrs.rot, scale: tok.attrs.scale, opacity: tok.attrs.opacity, w: tok.attrs.w, r: tok.attrs.r, labelOp: tok.attrs.labelOp });
  const key = (tok, t, s, extra = {}) => tok.kf.push({ t, s, ...extra });
  const orderOf = new Map(); // row → current ordered list

  // ---- initial keyframes
  for (let ri = 0; ri < 5; ri++) {
    const list = items.filter((t) => t.row === ri && t.present);
    orderOf.set(ri, list);
    const pos = layout(ri, list, false);
    list.forEach((tok) => key(tok, 0, snapshot(tok, pos.get(tok))));
    // fresh items sit at their future slot, invisible, until captured
    items.filter((t) => t.row === ri && t.fresh).forEach((tok) => key(tok, 0, snapshot(tok, LEFT + 700)));
  }

  // ---- operations. Each row runs the same grammar, offset so several rows are mid-operation at once.
  const T = { appear: 0.55, resolve: 0.5, vanish: 0.22, close: 0.45, reorder: 0.95, normalize: 0.95 };
  const rowStart = (ri) => 0.5 + ri * 0.55;
  const rowLast = { appear: 0, resolve: 0, reorder: 0, normalize: 0 };

  function opAppear(ri, t0) {
    const list = orderOf.get(ri), fresh = items.find((t) => t.row === ri && t.fresh);
    const at = 1 + Math.floor(r.range(1, list.length - 1));
    list.splice(at, 0, fresh); fresh.present = true;
    const pos = layout(ri, list, false);
    list.forEach((tok) => key(tok, t0, snapshot(tok, tok === fresh ? pos.get(tok) : tok.kf[tok.kf.length - 1].s.x)));
    fresh.attrs.scale = 1;
    list.forEach((tok) => key(tok, t0 + T.appear, snapshot(tok, pos.get(tok)), { ease: tok === fresh ? 'out' : 'inOut' }));
    return t0 + T.appear;
  }
  function opResolve(ri, t0) {
    const list = orderOf.get(ri), dup = list.find((t) => t.dup);
    const twin = list.find((t) => t !== dup && t.spec.kind === 'pill' && t.spec.label === dup.spec.label);
    const cur = (tok) => tok.kf[tok.kf.length - 1].s;
    list.forEach((tok) => key(tok, t0, { ...cur(tok) }));
    // duplicate slides onto its twin (passing above it), then vanishes into it
    key(dup, t0 + T.resolve, { ...cur(dup), x: cur(twin).x, y: cur(twin).y, rot: cur(twin).rot, scale: 0.92 }, { arc: -1 });
    key(dup, t0 + T.resolve + T.vanish, { ...cur(dup), x: cur(twin).x, y: cur(twin).y, scale: 0, opacity: 0 });
    dup.present = false; dup.attrs.scale = 0; dup.attrs.opacity = 0;
    list.splice(list.indexOf(dup), 1);
    // the row closes the gap
    const pos = layout(ri, list, false);
    const tc = t0 + T.resolve + 0.1;
    list.forEach((tok) => { key(tok, tc, { ...cur(tok) }); key(tok, tc + T.close, snapshot(tok, pos.get(tok))); });
    return tc + T.close;
  }
  function opReorder(ri, t0) {
    const list = orderOf.get(ri);
    // sequence rule: pills first in label order, beads after — a visible sort
    const sorted = list.slice().sort((a, b) => {
      const ka = a.spec.kind === 'dot' ? 1 : 0, kb = b.spec.kind === 'dot' ? 1 : 0;
      return ka - kb || (a.spec.label || '').localeCompare(b.spec.label || '');
    });
    orderOf.set(ri, sorted);
    const pos = layout(ri, sorted, false);
    const cur = (tok) => tok.kf[tok.kf.length - 1].s;
    sorted.forEach((tok, i) => {
      const from = cur(tok), to = pos.get(tok), st = t0 + i * 0.07;
      key(tok, st, { ...from });
      key(tok, st + T.reorder - i * 0.03, snapshot(tok, to), { arc: to > from.x + 30 ? -1 : to < from.x - 30 ? 1 : 0 });
    });
    return t0 + T.reorder + sorted.length * 0.05;
  }
  function opNormalize(ri, t0) {
    const list = orderOf.get(ri);
    const cur = (tok) => tok.kf[tok.kf.length - 1].s;
    list.forEach((tok) => key(tok, t0, { ...cur(tok) }));
    list.forEach((tok) => { const dot = tok.spec.kind === 'dot'; Object.assign(tok.attrs, { w: dot ? tok.attrs.w : W_U, r: dot ? R_U : 0, rot: 0, dy: 0, gap: GAP_U, scale: 1, labelOp: dot ? 0 : 1 }); });
    const pos = layout(ri, list, true);
    list.forEach((tok, i) => key(tok, t0 + T.normalize + i * 0.04, snapshot(tok, pos.get(tok))));
    return t0 + T.normalize + list.length * 0.04;
  }

  for (let ri = 0; ri < 5; ri++) {
    let t = rowStart(ri);
    t = opAppear(ri, t); rowLast.appear = Math.max(rowLast.appear, t); t += 0.35;
    t = opResolve(ri, t); rowLast.resolve = Math.max(rowLast.resolve, t); t += 0.3;
    t = opReorder(ri, t); rowLast.reorder = Math.max(rowLast.reorder, t); t += 0.3;
    t = opNormalize(ri, t); rowLast.normalize = Math.max(rowLast.normalize, t);
  }
  const HOLD0 = rowLast.normalize + 0.3, DUR = HOLD0 + 2.6;

  // ---- render: piecewise keyframe interpolation per item
  const EASE = { inOut: ease.inOut, out: ease.out };
  function stateAt(tok, t) {
    const kf = tok.kf;
    if (t <= kf[0].t) return { s: kf[0].s };
    for (let i = 1; i < kf.length; i++) {
      if (t < kf[i].t) {
        const a = kf[i - 1], b = kf[i];
        const u = (EASE[b.ease] || ease.inOut)(remap(t, a.t, b.t));
        const s = {};
        for (const k in b.s) s[k] = lerp(a.s[k], b.s[k], u);
        if (b.arc) s.y += b.arc * 30 * Math.sin(u * Math.PI);
        return { s };
      }
    }
    return { s: kf[kf.length - 1].s };
  }
  function render(t) {
    const beat = t >= HOLD0 ? pulse((t - HOLD0) % 0.6, 0, 0.28) : 0;
    for (const tok of items) {
      const { s } = stateAt(tok, t);
      const dot = tok.spec.kind === 'dot';
      tok.set({
        x: s.x, y: s.y, rot: s.rot, opacity: s.opacity,
        scale: s.scale * (1 + beat * (dot ? 0.09 : 0.035)),
        w: dot ? undefined : s.w, r: dot ? s.r : undefined, labelOpacity: s.labelOp,
        visible: s.scale > 0.001,
      });
    }
    veil.setAttribute('opacity', Math.max(remap(t, DUR - 0.4, DUR), 1 - remap(t, 0, 0.3)));
  }

  const tl = new Timeline({
    duration: DUR, render, title: 'Stage 2', subtitle: 'transform — capture · resolve · sequence · normalize', mount,
    phases: [
      { name: 'capture', from: rowStart(0), to: rowLast.appear },
      { name: 'resolve', from: rowStart(0) + T.appear + 0.35, to: rowLast.resolve },
      { name: 'sequence', from: rowStart(0) + T.appear + 0.35 + T.resolve + 0.1 + T.close + 0.3, to: rowLast.reorder },
      { name: 'normalize', from: rowStart(0) + T.appear + 0.35 + T.resolve + 0.1 + T.close + 0.3 + T.reorder + 0.6, to: rowLast.normalize },
      { name: 'one rhythm', from: HOLD0, to: DUR },
    ],
  });
  tl.play();
  return tl;
};


/* Chapter viewer: mounts ONE scene at a time so each stage stays an isolated, self-contained loop. */
(() => {
  const svg = document.querySelector('svg.stage');
  const buttons = [...document.querySelectorAll('.chapters button')];
  let current = null;
  function show(name) {
    if (current) { current.destroy(); current = null; }
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    window.TL = current = BF.scenes[name](svg, document.body);
    buttons.forEach((b) => b.classList.toggle('on', b.dataset.scene === name));
    try { localStorage.setItem('bf-chapter', name); } catch (e) {}
  }
  buttons.forEach((b) => (b.onclick = () => show(b.dataset.scene)));
  window.addEventListener('keydown', (e) => { if (e.key === '1') show('pile'); if (e.key === '2') show('transform'); });
  let start = 'pile';
  try { start = localStorage.getItem('bf-chapter') || 'pile'; } catch (e) {}
  const hash = location.hash.replace('#', '');
  if (BF.scenes[hash]) start = hash;
  show(start);
})();
</script>
